name: BAB free native Mac tests
on:
  push:
    branches: [main]
    paths: ['app/**', 'build/**', 'tests/**', '.github/workflows/mac-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-test:
    if: ${{ github.event.repository.private == false && github.event.repository.visibility == 'public' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the native payload from hash-locked BAB inputs
        run: python3 build/build_on_mac.py
      - name: Install into the disposable Mac test machine
        run: sudo installer -pkg stage/BAB-native-test.pkg -target /
      - name: Native dependencies, offline speech, Cocoa and Finder startup
        run: python3 tests/run_mac_checks.py
      # Only standard public runners; no cache, paid runners or artifact uploads.
